# Builds LogHunter on Windows and Linux at every push, and publishes a release for every v* tag.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ── Windows: MSVC, official Qt ─────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: win64_msvc2022_64
          aqtversion: '==3.3.*'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $env:LOGHUNTER_QT = $env:QT_ROOT_DIR
          cmake --preset msvc-release

      - name: Build
        run: cmake --build build/msvc-release

      - name: Package
        run: cpack --config build/msvc-release/CPackConfig.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # ── Linux: GCC, Qt of Debian trixie ────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake ninja-build \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build build/linux-release

      - name: Package
        run: cpack --config build/linux-release/CPackConfig.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # ── Release: only for a v* tag ─────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version=$(sed -nE 's/^ *VERSION ([0-9.]+)$/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version of CMakeLists.txt."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --title "LogHunter ${GITHUB_REF_NAME#v}" --generate-notes
