title: Registry Hive Export
title_fr: 'Copie des ruches SAM ou SECURITY'
id: a04a162b-bb35-559c-8a40-6c16c75afe20
status: stable
description: 'The SAM, SECURITY or SYSTEM registry hive was saved to a file, which allows extracting local password hashes.'
description_fr: 'La ruche SAM, SECURITY ou SYSTEM du registre a été copiée dans un fichier, ce qui permet d''extraire les empreintes des mots de passe locaux.'
author: LogHunter
date: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1003.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_programme:
        Image|endswith: '\\reg.exe'
    selection_action:
        CommandLine|contains:
            - ' save '
            - ' export '
    selection_ruche:
        CommandLine|contains:
            - 'hklm\\sam'
            - 'hklm\\security'
            - 'hklm\\system'
            - 'hkey_local_machine\\sam'
            - 'hkey_local_machine\\security'
            - 'hkey_local_machine\\system'
    condition: all of selection_*
falsepositives:
    - Backup software
level: high
