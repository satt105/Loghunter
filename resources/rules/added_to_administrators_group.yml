title: Member Added to a Privileged Group
title_fr: 'Ajout à un groupe d''administrateurs'
id: 3b7ee021-afbc-5bf1-bab1-44fab9ab89bd
status: stable
description: 'An account was added to a highly privileged group (Administrators, Domain Admins, Enterprise Admins...).'
description_fr: 'Un compte a été ajouté à un groupe très privilégié (Administrateurs, Admins du domaine, Administrateurs de l''entreprise…).'
author: LogHunter
date: 2026-09-27
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_evenement:
        EventID:
            - 4728
            - 4732
            - 4756
    selection_groupe:
        - TargetSid: 'S-1-5-32-544'
        - TargetSid|endswith:
            - '-512'
            - '-518'
            - '-519'
        - TargetUserName:
            - 'Administrators'
            - 'Administrateurs'
            - 'Domain Admins'
            - 'Admins du domaine'
            - 'Enterprise Admins'
            - 'Administrateurs de l’entreprise'
            - 'Schema Admins'
            - 'Administrateurs du schéma'
    condition: selection_evenement and selection_groupe
falsepositives:
    - Planned administration
level: high
