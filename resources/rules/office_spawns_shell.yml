title: Office Application Launching a Shell
title_fr: 'Application Office qui lance un interpréteur'
id: 346c4f26-c841-5991-b848-2c36409129c0
status: stable
description: 'An Office application started a command interpreter or a script host, typical of a malicious document.'
description_fr: 'Une application Office a lancé un interpréteur de commandes ou de scripts, ce qui est typique d''un document piégé.'
author: LogHunter
date: 2026-09-27
tags:
    - attack.execution
    - attack.initial-access
    - attack.t1204.002
    - attack.t1566.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\\winword.exe'
            - '\\excel.exe'
            - '\\powerpnt.exe'
            - '\\outlook.exe'
            - '\\onenote.exe'
    selection_enfant:
        Image|endswith:
            - '\\cmd.exe'
            - '\\powershell.exe'
            - '\\pwsh.exe'
            - '\\wscript.exe'
            - '\\cscript.exe'
            - '\\mshta.exe'
            - '\\rundll32.exe'
            - '\\regsvr32.exe'
    condition: all of selection_*
falsepositives:
    - Office add-ins that start scripts
level: high
