title: Microsoft Defender Exclusion Added
title_fr: 'Exclusion ajoutée à Defender'
id: bf9892e4-44a9-5263-9632-d0ad0fe7e749
status: stable
description: 'An exclusion was added to Microsoft Defender, a common way to hide malware from scans.'
description_fr: 'Une exclusion a été ajoutée à Microsoft Defender. C''est un moyen courant de soustraire un logiciel malveillant aux analyses.'
