title: Active Directory Reconnaissance Commands
title_fr: 'Commandes de reconnaissance du domaine'
id: aeec1368-ece6-5a36-90d2-592e19b6e3d0
status: stable
description: 'Commands that list domain controllers, trusts or privileged groups were run.'
description_fr: 'Des commandes qui listent les contrôleurs de domaine, les relations d''approbation ou les groupes privilégiés ont été lancées.'
author: LogHunter
date: 2026-09-27
tags:
    - attack.discovery
    - attack.t1087.002
    - attack.t1482
logsource:
    product: windows
    category: process_creation
detection:
    selection_nltest:
        CommandLine|contains:
            - 'nltest /dclist'
            - 'nltest /domain_trusts'
            - 'nltest /dsgetdc'
    selection_groupes:
        CommandLine|contains:
            - 'group "domain admins"'
            - 'group "admins du domaine"'
            - 'group "enterprise admins"'
    selection_outils:
        Image|endswith:
            - '\\AdFind.exe'
            - '\\dsquery.exe'
    condition: 1 of selection_*
falsepositives:
    - Administrators troubleshooting the domain
level: medium
