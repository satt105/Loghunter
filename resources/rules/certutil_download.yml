title: File Downloaded With Certutil
title_fr: 'Téléchargement avec Certutil'
id: 3927b259-cf8a-59be-a0bd-12a13df491c4
status: stable
description: 'Certutil was used to download a file, a technique often used to fetch malicious tools.'
description_fr: 'Certutil a servi à télécharger un fichier, une technique souvent utilisée pour récupérer des outils malveillants.'
author: LogHunter
date: 2026-09-27
tags:
    - attack.command-and-control
    - attack.defense-evasion
    - attack.t1105
    - attack.t1140
logsource:
    product: windows
    category: process_creation
detection:
    selection_programme:
        Image|endswith: '\\certutil.exe'
    selection_option:
        CommandLine|contains:
            - 'urlcache'
            - 'verifyctl'
    selection_url:
        CommandLine|contains: 'http'
    condition: all of selection_*
falsepositives:
    - Certificate management
level: high
